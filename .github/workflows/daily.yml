name: Buddy 加油站每日自动化（多账号）

on:
  schedule:
    # GitHub 的 cron 是尽力而为：高负载时会延迟，甚至静默丢弃整次运行。
    # 因此设三个时段互为备份 —— 只要有一个跑到，当天就完成了。
    # 脚本幂等：已签过只返回「今日已签过」，名额用完不重派，多触发不会重复领取。
    #
    # 猫猫旅行时长最长 4 小时，间隔 6 小时保证下一轮必定已到家、可领回礼物。
    # 三个点都落在 :10，避开整点高负载期。cron 按 UTC 计时（括号内为北京时间）。
    - cron: "10 0 * * *"    # 00:10 UTC = 08:10 北京（主时段）
    - cron: "10 6 * * *"    # 06:10 UTC = 14:10 北京（备份）
    - cron: "10 12 * * *"   # 12:10 UTC = 20:10 北京（备份）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 执行多账号签到与派猫猫
        id: run
        env:
          # 多账号凭证：JSON 数组 [{"alias":"主号","token":"..."}, ...]
          # 在仓库 Settings → Secrets and variables → Actions 里新建 Secret：
          #   Name: WB_ACCOUNTS_JSON
          WB_ACCOUNTS_JSON: ${{ secrets.WB_ACCOUNTS_JSON }}
          WB_ENDPOINT: https://copilot.tencent.com
          WB_RESULT_FILE: ${{ runner.temp }}/wb_result.md
        run: |
          set -uo pipefail
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            echo "未找到可用的 Python 解释器" >&2
            exit 1
          fi
          set +e
          "$PY" wb_multi.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 单账号失败不阻断整体；以 0 退出，仅用 warning 提示未完成项
          if [ "$code" -ne 0 ]; then
            echo "::warning::本轮存在未完成项，详见上方日志与 step summary"
          fi
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/wb_result.md
        run: |
          set -uo pipefail
          {
            echo "### Buddy 加油站 · 多账号每日自动化"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')（cron 为 UTC）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 未产出结论文案，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传积分台账
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: points-ledger-${{ github.run_id }}
          path: ledger/
          retention-days: 90
